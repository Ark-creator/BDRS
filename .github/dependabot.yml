version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - php
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: gomod
    directory: /wasm
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /python-ai
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
