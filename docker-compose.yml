services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-bdrs_react}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      IDENTITY_AI_BASE_URL: http://python-ai:8000
    depends_on:
      - mysql
      - redis
      - python-ai
    volumes:
      - app-storage:/var/www/html/storage
      - app-public:/var/www/html/public
    command: sh -c "cp -R /tmp/public/. /var/www/html/public && php-fpm"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - app-public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-bdrs_react}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      IDENTITY_AI_BASE_URL: http://python-ai:8000
    depends_on:
      - app
      - redis
      - python-ai
    command: php artisan queue:work redis --queue=identity-verification,default --sleep=3 --tries=3 --timeout=180
    volumes:
      - app-storage:/var/www/html/storage
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-bdrs_react}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      IDENTITY_AI_BASE_URL: http://python-ai:8000
    depends_on:
      - app
      - redis
      - python-ai
    command: sh -c "php artisan horizon || php artisan queue:work redis --queue=identity-verification,default --sleep=3 --tries=3 --timeout=180"
    volumes:
      - app-storage:/var/www/html/storage
    restart: unless-stopped

  python-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
      args:
        INSTALL_HEAVY_AI: ${INSTALL_HEAVY_AI:-false}
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bdrs_react}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped

volumes:
  app-storage:
  app-public:
  redis-data:
  mysql-data:
