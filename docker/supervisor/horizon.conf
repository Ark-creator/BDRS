[program:laravel-horizon]
process_name=%(program_name)s
command=sh -c "php /var/www/html/artisan horizon || php /var/www/html/artisan queue:work redis --queue=identity-verification,default --sleep=3 --tries=3 --timeout=180"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/horizon.log
stopwaitsecs=3600
